name: 'Jekyll Deploy Action'

description: >
  A Github Action to deploy the Jekyll site conveniently for GitHub Pages

branding:
  icon: 'command'
  color: 'red'

inputs:
  provider:
    description: 'The deploy provider'
    required: false
  owner:
    description: 'The deploy owner'
    required: false
  token:
    description: 'The deploy token'
    required: false
  credentials:
    description: 'The gcloud credentials'
    required: true
  repository:
    description: 'The deploy repository'
    required: false
  branch:
    description: 'The deploy branch'
    required: false
  actor:
    description: 'The github username creating the commit'
    required: false
  gell_mann:
    description: 'The pre-build configuration'
    required: true
  id:
    description: The id according to os
    required: true

outputs:
  exponentiation:
    value: ${{ join(steps.exponentiation.outputs.*, '\n') }}
  identition:
    value: ${{ join(steps.identition.outputs.*, '\n') }}

runs:
  #using: 'node20'
  #main: '.github/run/main.js'
  #post: '.github/run/post.js'
  #post-if: 'success()'
  using: composite
  
  steps:
    - name: Setup .NET SDK
      if: runner.os == '-Windows'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Jekyll pages
      if: runner.os == '-Windows'
      id: jekyll_site
      shell: bash
      run: |
        ${{ github.action_path }}/.github/entrypoint/github_pages.sh
