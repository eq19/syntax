name: 'Jekyll Deploy Action'

description: >
  A Github Action to deploy the Jekyll site conveniently for GitHub Pages

branding:
  icon: 'command'
  color: 'red'

inputs:
  owner:
    description: 'The deploy owner'
    required: false
  actor:
    description: 'The github username creating the commit'
    required: false
  token:
    description: 'The deploy token'
    required: false
  api_key:
    description: 'The api key'
    required: true
  api_secret:
    description: 'The api secret'
    required: false
  credentials:
    description: 'The gcloud credentials'
    required: true
  pauli_sum:
    description: 'The pre-build configuration'
    required: true
  failure_status:
    description: 'The deploy branch'
    required: false

outputs:
  all_outputs:
    description: Collect all outputs
    value: ${{ toJSON(steps.*.outputs) }}

runs:
  #using: 'node20'
  #main: '.github/run/main.js'
  #post: '.github/run/post.js'
  #post-if: 'success()'
  using: composite
  
  steps:
    - name: Target Configuration
      uses: eq19/eq19/.github/actions/3-exponentiation/5-syntax@v2
      if: ${{ env.JOBS_ID == 3 }}
      id: exponentiation
      with:
        hub_username: ${{ inputs.docker_hub_username }}
        hub_password: ${{ inputs.docker_hub_password }}
        failure_status: ${{ inputs.failure_status }}
        hub_token: ${{ inputs.docker_hub_token }}
        credentials: ${{ inputs.credentials }}
        action_path: ${{ github.action_path }}
        image_name: ${{ inputs.image_name }}
        api_secret: ${{ inputs.api_secret }}
        api_key: ${{ inputs.api_key }}
        token: ${{ inputs.token }}

    - name: Profiling Feedback
      uses: eq19/eq19/.github/actions/4-identition/5-syntax@v2
      if: ${{ env.JOBS_ID == 4 && inputs.failure_status == 'false' }}
      id: identition
      with:
        token: ${{ inputs.token }}
        image_name: ${{ inputs.image_name }}
        credentials: ${{ inputs.credentials }}
        workspace: ${GITHUB_WORKSPACE//\\//}
        action_path: ${GITHUB_ACTION_PATH//\\//}
        hub_token: ${{ inputs.docker_hub_token }} 
        failure_status: ${{ inputs.failure_status }}
        hub_username: ${{ inputs.docker_hub_username }}
